[project]
name = "apex-data-tools"
version = "0.1.0"
description = "Field data collection for Apex buggy practice: roll logging, Garmin watch ingest, and assignment."
readme = "README.md"
authors = [
    { name = "Noah Lowry", email = "noahclowry@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fitparse>=1.2.0",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.33",
    "segno>=1.6.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
apex = "apex.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "apex"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # fitparse uses datetime.utcfromtimestamp; not ours to fix.
    "ignore::DeprecationWarning:fitparse.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
