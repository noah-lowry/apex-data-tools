[project]
name = "apex-data-tools"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Noah Lowry", email = "noahclowry@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fitparse>=1.2.0",
    "gpxpy>=1.6.2",
    "pydantic>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "apex"
